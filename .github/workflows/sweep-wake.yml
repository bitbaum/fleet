# Wake the auto-merge sweeps that have something waiting (reusable + manual).
#
# A canary calls this when its Deploy or browser smoke finishes green: that is
# the event that clears the shared-package rollout gate, and nothing else wakes
# the sweep of a repo whose PR the gate was holding. Without it the PR waited for
# the next CI completion in its own repo or for GitHub's hourly cron, which does
# not fire reliably (42–131 minutes measured, 11 hours at worst).
#
# The same script also runs every 15 minutes from deploy-reconciler.yml, whose
# clock is the box's timer. See scripts/ci/sweep-wake.mjs for what it will and
# will not do. It only dispatches each repo's own auto-merge.yml, so every merge
# rule still applies.
name: Wake sweeps

on:
  # Callers pass `secrets: inherit`: dispatching a workflow in another repo
  # needs FLEET_PAT, and the org secret is the only thing that can do it.
  workflow_call: {}
  workflow_dispatch:
    inputs:
      go:
        description: 'Actually dispatch (false = report only).'
        type: boolean
        default: true

permissions:
  contents: read

# One wake at a time; a second waits for the first and then looks again.
concurrency:
  group: sweep-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: bitbaum/fleet
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Wake
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
          WAKE_SKIP: ${{ vars.SWEEP_WAKE_SKIP }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::FLEET_PAT is not set — cannot dispatch across repos."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.go }}" != "true" ]; then
            node scripts/ci/sweep-wake.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/ci/sweep-wake.mjs --go | tee -a "$GITHUB_STEP_SUMMARY"
          fi
