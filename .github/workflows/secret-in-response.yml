# Rung 5, finally wired.
#
# `scripts/audit/secret-in-response.py` has existed since 2026-09-15 with a
# 9-case test suite covering both directions, a README that ends "Exit code is 1
# if anything CRITICAL or HIGH was found, so it can gate CI", and a real
# cross-account disclosure to its name — vitareba's `GET /api/admin/patients`
# returning every patient's bcrypt digest, which the code-level sweep had missed
# because the route reads `findMany()` with no projection and the grep for
# `json(user)` shapes does not match `json({ success, data })`.
#
# NOTHING RAN IT. Not a workflow, not ci.yml, not even its test. The floor audit
# has a name for that shape — UNCALLED — and here it applied to the gate
# templates/ci/README.md calls the one that catches what has actually cost this
# fleet money: the `passwordHash` leak twice, identity from the request body,
# the query missing its tenant filter.
#
# WHAT THIS PROVES, AND WHAT IT DOES NOT.
#
# Unauthenticated only. The README is explicit that the authenticated pass is
# "the real test" — most interesting routes 401 without a session — and that
# half needs a live session cookie per app, held as a rotating secret. A gate
# needing twelve of those is a gate that stops running, so it stays manual and
# this file says so rather than letting green imply more than it proves.
#
# What it does cover is strictly the worse class: credential material reachable
# with NO LOGIN AT ALL, by anyone, right now.
#
# Daily. A leak of this kind is introduced by a deploy, and deploys land many
# times a day; a weekly sweep would leave one live for up to a week. It reads
# three paths on twelve hosts — cheap enough that a tighter cadence buys
# nothing.

name: Secret in response

on:
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit/**'

permissions:
  contents: read

concurrency:
  group: secret-in-response-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Both suites run BEFORE the live sweep, and they answer different
      # questions: the detector's (does a bcrypt digest in a flight payload
      # fire, does a correctly projected response stay quiet) and the sweep's
      # (does one app's finding reach exit 1, is an unreachable host withheld
      # rather than counted clean). The second caught the sweep claiming a
      # clean fleet when every host was unreachable — before it ever ran on a
      # bad day.
      - name: The detector bites, in both directions
        run: python3 scripts/audit/test-secret-in-response.py

      - name: The sweep aggregates honestly
        run: bash scripts/audit/test-secret-in-response-sweep.sh

      # On a PR only the fixtures run: the live verdict is a fact about the
      # apps, not about the change under review, and failing a branch on
      # someone else's deploy teaches people to merge past red.
      - name: Nothing credential-shaped without a login
        if: github.event_name != 'pull_request'
        env:
          # Reads loki:scripts/hetzner/apps.conf, the live-app SSOT, from its
          # default branch. FLEET_PAT is the only cross-repo token that exists
          # here — naming one that does not is not an error in Actions, it
          # silently degrades to the repo-scoped default and the sweep then
          # covers nothing. See audit-health.sh's PHANTOM SECRET check.
          GH_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo '## Secret in response'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          bash scripts/audit/secret-in-response-sweep.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Tell someone
        # A credential reachable without a login is the one finding in this
        # repo that should not wait for someone to open the Actions tab.
        if: failure() && github.event_name != 'pull_request'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "TELEGRAM_* secrets missing — alert undeliverable" >&2; exit 1; }
          curl -sS --fail --max-time 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔓 Fleet SECRET-IN-RESPONSE failed — either credential material is reachable on a live app WITHOUT a login, or the sweep could not read enough to judge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null
          echo "telegram alerted"
