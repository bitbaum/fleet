# Do apps.conf owners and readings.json counts agree with org.json businessFacts?
# See scripts/ci/business-facts-audit.sh. Runs when the registers change, and
# weekly to catch an apps.conf edit in loki.
name: Business facts

on:
  pull_request:
    paths: ['registers/**', 'scripts/ci/business-facts-audit.sh', '.github/workflows/business-facts.yml']
  schedule:
    - cron: '41 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Registers agree with business facts
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/business-facts-audit.sh
