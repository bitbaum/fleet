name: Package canary contracts
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - registers/package-rollouts.json
      - scripts/ci/package-canary-audit*
      - .github/workflows/package-canaries.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/ci/package-canary-audit.test.mjs
      - name: Verify actual canary package bindings
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/ci/package-canary-audit.mjs
