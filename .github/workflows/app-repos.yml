# App and service repos come from a declaration, not from a person's click.
#
# registers/app-repos.json lists the app and service repos that must exist.
# On a change to it (or to the script), and daily as a retry, this creates
# every declared repo that is missing, with the declared visibility, its main
# seeded with templates/app-repo (the auto-merge caller).
# Existing repos are never written to.
#
# Why CI and not an agent: an agent session's GitHub integration may not
# create org repos (403 on POST /orgs/bitbaum/repos), which left bitbaum/signin
# waiting on an owner's click on 2026-10-30. package-repos.yml is the same
# pattern for packages.
name: App repos

on:
  push:
    branches: [main]
    paths:
      - registers/app-repos.json
      - scripts/repos/**
      - templates/app-repo/**
      # imported by scripts/repos/create-app-repos.mjs (repoExists, toCreate)
      - scripts/packages/create-package-repos.mjs
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: app-repos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Create the declared app repos that do not exist
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::FLEET_PAT is not set; no repo can be created."
            exit 1
          fi
          node scripts/repos/create-app-repos.mjs
