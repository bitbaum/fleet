# The org-wide drift scan reads documentation from every active repository.
# Run it when the shared truth or its checker changes, and once a day for
# ongoing detection. App PRs use the changed-document gate in the shared
# auto-merge sweep; they do not need to rescan every other app.
name: Org drift

on:
  pull_request:
    branches: [main]
    paths:
      - registers/org.json
      - registers/retired.json
      - scripts/ci/org-drift-audit.sh
      - scripts/ci/org-drift.baseline
  push:
    branches: [main]
    paths:
      - registers/org.json
      - registers/retired.json
      - scripts/ci/org-drift-audit.sh
      - scripts/ci/org-drift.baseline
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: org-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check the organization documentation against shared truth
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/org-drift-audit.sh --check
