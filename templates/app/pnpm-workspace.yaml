# pnpm 11 refuses to run a dependency's build script unless it is approved
# here, and it EXITS NON-ZERO when one is neither approved nor refused — so
# without this file a fresh product cannot install, the deploy dies before the
# build, and a fully provisioned host serves 502. pnpm 11 no longer reads the
# "pnpm" field in package.json; a setting written there is present and inert.
allowBuilds:
  # native image codec next uses for image optimisation
  sharp: true
  # native resolver used by eslint-config-next
  unrs-resolver: true
  # Vitest and drizzle-kit need esbuild's binary
  esbuild: true
  # prebuilt binaries ship with these; their install scripts are not needed
  "@parcel/watcher": false
  "@swc/core": false

# Our own packages are published by our own tagged workflows and are refused by
# minimumReleaseAge until they age, which fails `pnpm install --frozen-lockfile`
# with a bare exit 1. Exempt them BY NAME (fleet SHARED.md, "If one breaks").
minimumReleaseAgeExclude:
  - "@bitbaum/ai-kit"
  - "@bitbaum/design-tokens"
  - "@bitbaum/mail-kit"
  - limitkit
  - bip-kit
