# GOLDEN CI FLOOR — npm repos. See templates/ci/README.md.
# Copy to .github/workflows/ci.yml and adjust step commands to the repo's scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the older run obsolete — don't waste minutes finishing it.
# On a branch the newest push is the only one that matters, so cancel the rest.
#
# On main the group is keyed per COMMIT. A commit cancelling a DIFFERENT
# commit's run breaks deployment, because everything downstream keys off that
# run: a deploy that waits for CI to pass on the commit finds a cancelled run
# and stops, and a deploy chained on `workflow_run` sees conclusion=cancelled
# and skips. auto-merge also re-arms CI with a dispatch, which under one
# group-per-branch cancels the push run for the same commit.
#
# Measured 2026-09-11: fleetcrown stranded four merges silently (main green,
# nothing red, the box serving the previous build) and hirnli failed its deploy
# loudly at the wait step. Both were this line.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Next keeps its compiler output in .next/cache. Without restoring it,
      # EVERY CI run recompiles the whole app from scratch — and the deploy then
      # compiles it a second time. Measured across the fleet on 2026-09-07: of
      # eight repos, exactly one cached this, and CI medians ran 1.9m to 10.7m
      # for the same class of app.
      #
      # Delete this step if the repo is not a Next app. Keep the key on the
      # lockfile so a dependency change invalidates it, and keep the bare
      # restore-key last: a stale cache still beats no cache, and Next validates
      # its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      # SSOT: "verified" is defined ONCE, in package.json `verify`
      # (= lint + typecheck + test), and run identically here and locally via
      # `npm run verify`. Change the checks in one place, not two.
      - name: Verify
        run: npm run verify

      - name: Build
        # Hermetic compile: proves the shipped artifact builds. Placeholder DB
        # URL covers tools that read the var without connecting.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build
