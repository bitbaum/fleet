# GOLDEN CI FLOOR — pnpm repos. See templates/ci/README.md.
# Copy to .github/workflows/ci.yml and adjust step commands to the repo's scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the older run obsolete — don't waste minutes finishing it.
# On a branch the newest push is the only one that matters, so cancel the rest.
#
# On main the group is keyed per COMMIT. A commit cancelling a DIFFERENT
# commit's run breaks deployment, because everything downstream keys off that
# run: a deploy that waits for CI to pass on the commit finds a cancelled run
# and stops, and a deploy chained on `workflow_run` sees conclusion=cancelled
# and skips. auto-merge also re-arms CI with a dispatch, which under one
# group-per-branch cancels the push run for the same commit.
#
# Measured 2026-09-11: loki stranded four merges silently (main green,
# nothing red, the box serving the previous build) and hirnli failed its deploy
# loudly at the wait step. Both were this line.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        # NO `version:` INPUT ON PURPOSE. package.json `packageManager`
        # (pnpm@11.25.0 across the fleet) is the single source for the pnpm
        # version, and action-setup@v4 reads it. Setting BOTH is not a
        # redundancy, it is a hard error before a single step runs:
        #
        #   Error: Multiple versions of pnpm specified:
        #     - version 11 in the GitHub Action config with the key "version"
        #     - version pnpm@11.25.0 in the package.json with "packageManager"
        #
        # This template carried `version: 11` until 2026-09-17 while all seven
        # pnpm repos checked had quietly dropped it — so the template could not
        # be copied into any fleet repo without failing, and the golden floor
        # was the one shape nobody could actually adopt. listkit adopting it
        # verbatim is how that surfaced.
        #
        # (Why 11 at all: pnpm 9 errors "packages field missing or empty" on a
        # settings-only pnpm-workspace.yaml; pnpm 10+ treats it as optional.
        # Pin it in package.json, once.)

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite). Keep the
          # pnpm major above and this Node major in lockstep.
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Next keeps its compiler output in .next/cache. Without restoring it,
      # EVERY CI run recompiles the whole app from scratch — and the deploy then
      # compiles it a second time. Measured across the fleet on 2026-09-07: of
      # eight repos, exactly one cached this, and CI medians ran 1.9m to 10.7m
      # for the same class of app.
      #
      # Delete this step if the repo is not a Next app. Keep the key on the
      # lockfile so a dependency change invalidates it, and keep the bare
      # restore-key last: a stale cache still beats no cache, and Next validates
      # its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # SSOT: "verified" is defined ONCE, in package.json `verify`
      # (= lint + typecheck + test), and run identically here and locally via
      # `pnpm run verify`. Change the checks in one place, not two.
      - name: Verify
        run: pnpm run verify

      - name: Build
        # Hermetic compile: proves the shipped artifact builds. Placeholder DB
        # URL covers tools (drizzle-kit/config) that read the var without
        # connecting. Real secrets are never needed to compile.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: pnpm run build
